<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pemindai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-destructive-foreground: var(--destructive-foreground);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-sans: var(--font-sans);
        --font-heading: var(--font-heading, var(--font-sans));
        --font-serif: var(--font-serif);
        --font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full,
      .rounded-none,
      .rounded-t-full,
      .rounded-t-none,
      .rounded-r-full,
      .rounded-r-none,
      .rounded-b-full,
      .rounded-b-none,
      .rounded-l-full,
      .rounded-l-none,
      .rounded-s-full,
      .rounded-s-none,
      .rounded-e-full,
      .rounded-e-none,
      .rounded-tl-full,
      .rounded-tl-none,
      .rounded-tr-full,
      .rounded-tr-none,
      .rounded-bl-full,
      .rounded-bl-none,
      .rounded-br-full,
      .rounded-br-none,
      .rounded-ss-full,
      .rounded-ss-none,
      .rounded-se-full,
      .rounded-se-none,
      .rounded-es-full,
      .rounded-es-none,
      .rounded-ee-full,
      .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }

      @layer base {
        * {
          @apply border-border outline-ring/50;
        }
        body {
          @apply bg-background text-foreground font-sans;
        }
      }

      :root {
        --shape: round;
        --shape-multiplier: 1;

        --background: #f0f3f8;
        --foreground: #0e1c2e;
        --primary: #1a56b0;
        --primary-foreground: #ffffff;
        --secondary: #e1e9f3;
        --secondary-foreground: #0e1c2e;
        --muted: #e1e9f3;
        --muted-foreground: #52647c;
        --accent: #0e9cc0;
        --accent-foreground: #0e1c2e;
        --destructive: #b42318;
        --destructive-foreground: #ffffff;
        --card: #fbfdff;
        --card-foreground: #0e1c2e;
        --popover: #fbfdff;
        --popover-foreground: #0e1c2e;
        --border: #c7cbd1;
        --input: #fbfdff;
        --ring: #1a56b0;
        --chart-1: #1a56b0;
        --chart-2: #0e9cc0;
        --chart-3: #52647c;
        --chart-4: #ffd23f;
        --chart-5: #14478c;

        --font-sans: "Atkinson Hyperlegible", sans-serif;
        --font-heading: "Chakra Petch", sans-serif;
        --font-serif: "Playfair Display", serif;
        --font-mono: "JetBrains Mono", monospace;

        --radius: 0.5rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-background text-foreground font-sans pb-8">
      <header class="bg-secondary border-b border-border">
        <div class="h-1.5 w-full bg-primary"></div>
        <div class="px-4 pt-4 pb-4">
          <div class="flex items-center gap-3">
            <div class="grid grid-cols-2 gap-0.5 size-8 shrink-0" aria-hidden>
              <span class="bg-primary rounded-sm"></span><span class="bg-primary rounded-sm"></span
              ><span class="bg-primary rounded-sm"></span><span class="bg-accent rounded-sm"></span>
            </div>
            <div class="min-w-0">
              <h1
                class="font-heading font-bold uppercase text-[21px] leading-tight tracking-[0.6px] text-foreground"
              >
                COST QR Generator
              </h1>
              <p class="text-[13px] leading-[18px] text-muted-foreground">
                Buat dan pindai QR dalam satu alat.
              </p>
            </div>
          </div>
          <div class="mt-2 h-1 w-14 bg-chart-4 rounded-full" aria-hidden></div>
          <div
            role="tablist"
            class="mt-4 grid grid-cols-2 gap-1 p-1 rounded-lg bg-background border border-border"
          >
            <button
              role="tab"
              class="min-h-11 rounded-md text-foreground font-heading font-bold uppercase tracking-[0.5px] text-sm"
            >
              Buat QR</button
            ><button
              role="tab"
              class="min-h-11 rounded-md bg-primary text-primary-foreground font-heading font-bold uppercase tracking-[0.5px] text-sm"
              aria-selected
            >
              Pindai
            </button>
          </div>
        </div>
      </header>
      <main class="px-4 pt-4 flex flex-col gap-4">
        <section class="flex flex-col gap-3">
          <div
            role="img"
            class="relative mx-auto w-full max-w-[300px] aspect-square rounded-[10px] bg-foreground overflow-hidden"
            aria-label="Bingkai pemindaian kamera"
          >
            <span
              class="absolute top-4 left-4 size-10 border-t-4 border-l-4 border-chart-4 rounded-tl-[4px]"
            ></span
            ><span
              class="absolute top-4 right-4 size-10 border-t-4 border-r-4 border-chart-4 rounded-tr-[4px]"
            ></span
            ><span
              class="absolute bottom-4 left-4 size-10 border-b-4 border-l-4 border-chart-4 rounded-bl-[4px]"
            ></span
            ><span
              class="absolute bottom-4 right-4 size-10 border-b-4 border-r-4 border-chart-4 rounded-br-[4px]"
            ></span
            ><span
              class="absolute left-8 right-8 top-1/2 h-0.5 bg-accent rounded-full"
              aria-hidden
            ></span>
            <div class="absolute inset-0 flex items-center justify-center">
              <iconify-icon
                icon="ph:qr-code"
                class="text-muted opacity-40"
                aria-hidden
                width="64"
                height="64"
              ></iconify-icon>
            </div>
          </div>
          <div class="flex items-center justify-between gap-3">
            <p class="text-[13px] leading-[18px] text-muted-foreground max-w-[220px]">
              Arahkan kamera ke QR, pastikan seluruh kode masuk bingkai.
            </p>
            <button
              class="min-h-11 min-w-11 px-3 rounded-[8px] bg-card border-[1.5px] border-[rgba(14,28,46,0.22)] text-foreground font-heading font-bold uppercase tracking-[0.5px] text-xs inline-flex items-center gap-1.5"
              aria-label="Nyalakan senter"
            >
              <iconify-icon icon="ph:flashlight" width="20" height="20"></iconify-icon>Senter
            </button>
          </div>
        </section>
        <div class="flex flex-col">
          <div class="flex items-center gap-2">
            <h2
              class="font-heading font-bold uppercase text-[15px] tracking-[0.5px] text-foreground"
            >
              Hasil pindai
            </h2>
            <span
              class="rounded-full border border-border bg-card px-2.5 py-0.5 text-xs font-heading font-bold tracking-[0.4px] text-muted-foreground"
              >3</span
            >
          </div>
          <div class="mt-1 h-1 w-12 bg-chart-4" aria-hidden></div>
        </div>
        <article
          class="bg-secondary border-[1.5px] border-[rgba(14,28,46,0.22)] rounded-[10px] shadow-[0_6px_16px_rgba(14,28,46,0.08)] p-3 flex flex-col gap-3"
        >
          <div class="flex items-center justify-between gap-2">
            <span
              class="rounded-full bg-card border border-border text-foreground px-2.5 py-1 text-xs font-heading font-bold uppercase tracking-[0.4px] inline-flex items-center gap-1"
              ><iconify-icon icon="ph:shield-check" width="16" height="16"></iconify-icon>Aman</span
            ><span class="text-[13px] leading-[18px] text-muted-foreground">URL</span>
          </div>
          <p class="text-base leading-[25px] text-foreground break-all">
            https://cost.sch.id/jadwal-lab
          </p>
          <div class="grid grid-cols-2 gap-2">
            <button
              class="min-h-11 rounded-[8px] bg-card border-[1.5px] border-[rgba(14,28,46,0.22)] text-foreground font-heading font-bold uppercase tracking-[0.5px] text-sm"
            >
              Salin</button
            ><button
              class="min-h-11 rounded-[8px] bg-primary text-primary-foreground font-heading font-bold uppercase tracking-[0.5px] text-sm"
            >
              Buka
            </button>
          </div>
        </article>
        <article
          class="bg-secondary border-[1.5px] border-[rgba(14,28,46,0.22)] rounded-[10px] shadow-[0_6px_16px_rgba(14,28,46,0.08)] p-3 flex flex-col gap-3"
        >
          <div class="flex items-center justify-between gap-2">
            <span
              class="rounded-full bg-chart-4 text-foreground px-2.5 py-1 text-xs font-heading font-bold uppercase tracking-[0.4px] inline-flex items-center gap-1"
              ><iconify-icon icon="ph:warning" width="16" height="16"></iconify-icon>Waspada</span
            ><span class="text-[13px] leading-[18px] text-muted-foreground">URL pendek</span>
          </div>
          <p class="text-base leading-[25px] text-foreground break-all">
            http://bit.ly/hadiah-gratis-2025
          </p>
          <div class="grid grid-cols-2 gap-2">
            <button
              class="min-h-11 rounded-[8px] bg-card border-[1.5px] border-[rgba(14,28,46,0.22)] text-foreground font-heading font-bold uppercase tracking-[0.5px] text-sm"
            >
              Salin</button
            ><button
              class="min-h-11 rounded-[8px] bg-primary text-primary-foreground font-heading font-bold uppercase tracking-[0.5px] text-sm"
            >
              Buka
            </button>
          </div>
        </article>
        <article
          class="bg-secondary border-[1.5px] border-[rgba(14,28,46,0.22)] rounded-[10px] shadow-[0_6px_16px_rgba(14,28,46,0.08)] p-3 flex flex-col gap-3"
        >
          <div class="flex items-center justify-between gap-2">
            <span
              class="rounded-full bg-destructive text-destructive-foreground px-2.5 py-1 text-xs font-heading font-bold uppercase tracking-[0.4px] inline-flex items-center gap-1"
              ><iconify-icon icon="ph:warning-octagon" width="16" height="16"></iconify-icon
              >Bahaya</span
            ><span class="text-[13px] leading-[18px] text-muted-foreground">URL</span>
          </div>
          <p class="text-base leading-[25px] text-foreground break-all">
            http://login-cost-verify.xyz/akun
          </p>
          <div class="grid grid-cols-2 gap-2">
            <button
              class="min-h-11 rounded-[8px] bg-card border-[1.5px] border-[rgba(14,28,46,0.22)] text-foreground font-heading font-bold uppercase tracking-[0.5px] text-sm"
            >
              Salin</button
            ><button
              class="min-h-11 rounded-[8px] bg-card border-[1.5px] border-[rgba(14,28,46,0.22)] text-destructive font-heading font-bold uppercase tracking-[0.5px] text-sm"
            >
              Buka
            </button>
          </div>
        </article>
      </main>
    </div>
  </body>
</html>
