<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-destructive-foreground: var(--destructive-foreground);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-sans: var(--font-sans);
        --font-heading: var(--font-heading, var(--font-sans));
        --font-serif: var(--font-serif);
        --font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full,
      .rounded-none,
      .rounded-t-full,
      .rounded-t-none,
      .rounded-r-full,
      .rounded-r-none,
      .rounded-b-full,
      .rounded-b-none,
      .rounded-l-full,
      .rounded-l-none,
      .rounded-s-full,
      .rounded-s-none,
      .rounded-e-full,
      .rounded-e-none,
      .rounded-tl-full,
      .rounded-tl-none,
      .rounded-tr-full,
      .rounded-tr-none,
      .rounded-bl-full,
      .rounded-bl-none,
      .rounded-br-full,
      .rounded-br-none,
      .rounded-ss-full,
      .rounded-ss-none,
      .rounded-se-full,
      .rounded-se-none,
      .rounded-es-full,
      .rounded-es-none,
      .rounded-ee-full,
      .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }

      @layer base {
        * {
          @apply border-border outline-ring/50;
        }
        body {
          @apply bg-background text-foreground font-sans;
        }
      }

      :root {
        --shape: round;
        --shape-multiplier: 1;

        --background: #f0f3f8;
        --foreground: #0e1c2e;
        --primary: #1a56b0;
        --primary-foreground: #ffffff;
        --secondary: #e1e9f3;
        --secondary-foreground: #0e1c2e;
        --muted: #e1e9f3;
        --muted-foreground: #52647c;
        --accent: #0e9cc0;
        --accent-foreground: #0e1c2e;
        --destructive: #b42318;
        --destructive-foreground: #ffffff;
        --card: #fbfdff;
        --card-foreground: #0e1c2e;
        --popover: #fbfdff;
        --popover-foreground: #0e1c2e;
        --border: #c7cbd1;
        --input: #fbfdff;
        --ring: #1a56b0;
        --chart-1: #1a56b0;
        --chart-2: #0e9cc0;
        --chart-3: #52647c;
        --chart-4: #ffd23f;
        --chart-5: #14478c;

        --font-sans: "Atkinson Hyperlegible", sans-serif;
        --font-heading: "Chakra Petch", sans-serif;
        --font-serif: "Playfair Display", serif;
        --font-mono: "JetBrains Mono", monospace;

        --radius: 0.5rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-background text-foreground font-sans pb-8">
      <header class="bg-secondary border-b border-border">
        <div class="h-1.5 w-full bg-primary"></div>
        <div class="px-4 pt-4 pb-4">
          <div class="flex items-center gap-3">
            <div class="grid grid-cols-2 gap-0.5 size-8 shrink-0" aria-hidden>
              <span class="bg-primary rounded-sm"></span><span class="bg-primary rounded-sm"></span
              ><span class="bg-primary rounded-sm"></span><span class="bg-accent rounded-sm"></span>
            </div>
            <div class="min-w-0">
              <h1
                class="font-heading font-bold uppercase text-[21px] leading-tight tracking-[0.6px] text-foreground"
              >
                COST QR Generator
              </h1>
              <p class="text-[13px] leading-[18px] text-muted-foreground">
                Buat dan pindai QR dalam satu alat.
              </p>
            </div>
          </div>
          <div class="mt-2 h-1 w-14 bg-chart-4 rounded-full" aria-hidden></div>
          <div
            role="tablist"
            class="mt-4 grid grid-cols-2 gap-1 p-1 rounded-lg bg-background border border-border"
          >
            <button
              role="tab"
              class="min-h-11 rounded-md bg-primary text-primary-foreground font-heading font-bold uppercase tracking-[0.5px] text-sm"
              aria-selected
            >
              Buat QR</button
            ><button
              role="tab"
              class="min-h-11 rounded-md text-foreground font-heading font-bold uppercase tracking-[0.5px] text-sm"
            >
              Pindai
            </button>
          </div>
        </div>
      </header>
      <main class="px-4 pt-4 flex flex-col gap-4">
        <div
          role="tablist"
          class="grid grid-cols-4 gap-1 p-1 rounded-lg bg-secondary border border-border"
        >
          <button
            class="min-h-11 rounded-md bg-primary text-primary-foreground font-heading font-bold uppercase tracking-[0.4px] text-xs"
          >
            URL</button
          ><button
            class="min-h-11 rounded-md text-foreground font-heading font-bold uppercase tracking-[0.4px] text-xs"
          >
            Teks</button
          ><button
            class="min-h-11 rounded-md text-foreground font-heading font-bold uppercase tracking-[0.4px] text-xs"
          >
            WiFi</button
          ><button
            class="min-h-11 rounded-md text-foreground font-heading font-bold uppercase tracking-[0.4px] text-xs"
          >
            Kontak
          </button>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="url" class="text-sm font-medium text-foreground">Link / URL</label
          ><input
            id="url"
            type="text"
            class="min-h-11 w-full rounded-[6px] border-[1.5px] border-[rgba(14,28,46,0.22)] bg-input px-3 text-base text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring"
            value="cost.sch.id/lab-sains"
          />
          <p class="text-[13px] leading-[18px] text-muted-foreground">
            Tanpa https:// juga bisa, otomatis dilengkapi.
          </p>
        </div>
        <section
          class="bg-card border-[1.5px] border-[rgba(14,28,46,0.22)] rounded-[10px] shadow-[0_6px_16px_rgba(14,28,46,0.08)] p-4 flex flex-col gap-4"
        >
          <div class="flex items-center justify-between">
            <h2
              class="font-heading font-bold uppercase text-[15px] tracking-[0.5px] text-foreground"
            >
              Pratinjau
            </h2>
            <span
              class="rounded-full bg-secondary text-foreground text-xs px-2.5 py-1 font-heading font-bold uppercase tracking-[0.4px]"
              >URL</span
            >
          </div>
          <div class="h-px bg-border" aria-hidden></div>
          <div
            class="bg-white rounded-md border border-border p-4 flex items-center justify-center"
          >
            <svg
              role="img"
              viewBox="0 0 21 21"
              class="w-full max-w-[240px] aspect-square"
              aria-label="QR code pratinjau"
              shape-rendering="crispEdges"
            >
              <rect fill="#ffffff" width="21" height="21" />
              <g fill="#0e1c2e">
                <rect x="1" y="1" width="7" height="7" />
                <rect x="2" y="2" fill="#ffffff" width="5" height="5" />
                <rect x="3" y="3" width="3" height="3" />
                <rect x="13" y="1" width="7" height="7" />
                <rect x="14" y="2" fill="#ffffff" width="5" height="5" />
                <rect x="15" y="3" width="3" height="3" />
                <rect x="1" y="13" width="7" height="7" />
                <rect x="2" y="14" fill="#ffffff" width="5" height="5" />
                <rect x="3" y="15" width="3" height="3" />
                <rect x="9" y="1" width="1" height="1" />
                <rect x="11" y="1" width="1" height="1" />
                <rect x="9" y="3" width="1" height="1" />
                <rect x="9" y="5" width="3" height="1" />
                <rect x="9" y="9" width="2" height="1" />
                <rect x="12" y="9" width="1" height="3" />
                <rect x="9" y="11" width="1" height="1" />
                <rect x="10" y="13" width="2" height="1" />
                <rect x="9" y="15" width="1" height="3" />
                <rect x="11" y="16" width="3" height="1" />
                <rect x="15" y="13" width="1" height="2" />
                <rect x="17" y="13" width="3" height="1" />
                <rect x="13" y="17" width="1" height="2" />
                <rect x="16" y="17" width="2" height="1" />
                <rect x="19" y="16" width="1" height="4" />
                <rect x="15" y="9" width="2" height="1" />
                <rect x="18" y="9" width="2" height="2" />
                <rect x="5" y="9" width="3" height="1" />
              </g>
            </svg>
          </div>
          <div class="flex flex-col gap-2">
            <button
              class="min-h-11 w-full rounded-[8px] bg-primary text-primary-foreground font-heading font-bold uppercase tracking-[0.5px] text-sm active:bg-[#14478c]"
            >
              Simpan PNG</button
            ><button
              class="min-h-11 w-full rounded-[8px] bg-card border-[1.5px] border-[rgba(14,28,46,0.22)] text-foreground font-heading font-bold uppercase tracking-[0.5px] text-sm"
            >
              Salin isi
            </button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
