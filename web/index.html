<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QrGenApp - pratinjau web</title>
    <style>
      /* Font COST, sama seperti yang dipakai Android. */
      @font-face {
        font-family: 'ChakraPetch-Bold';
        src: url('/fonts/ChakraPetch-Bold.ttf') format('truetype');
        font-display: swap;
      }
      @font-face {
        font-family: 'ChakraPetch-SemiBold';
        src: url('/fonts/ChakraPetch-SemiBold.ttf') format('truetype');
        font-display: swap;
      }
      @font-face {
        font-family: 'AtkinsonHyperlegible-Regular';
        src: url('/fonts/AtkinsonHyperlegible-Regular.ttf') format('truetype');
        font-display: swap;
      }
      @font-face {
        font-family: 'AtkinsonHyperlegible-Bold';
        src: url('/fonts/AtkinsonHyperlegible-Bold.ttf') format('truetype');
        font-display: swap;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: #f0f3f8;
        font-family: sans-serif;
      }
      /* Kotak selebar HP supaya proporsi layar Android tetap terlihat. */
      #root {
        max-width: 460px;
        margin: 0 auto;
        background: #f0f3f8;
        box-shadow: 0 10px 28px rgba(14, 28, 46, 0.1);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
