name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang dependency
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      - name: Build APK release (tanda tangan debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Catat ukuran APK
        working-directory: android/app/build/outputs/apk/release
        run: |
          ls -lh *.apk
          {
            echo "### Ukuran APK"
            echo ""
            echo "| Berkas | Ukuran |"
            echo "|---|---|"
            for f in *.apk; do
              echo "| $f | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rincian isi APK
        working-directory: android/app/build/outputs/apk/release
        run: |
          python3 - <<'PY'
          import glob
          import zipfile
          from collections import defaultdict

          for apk in sorted(glob.glob('*.apk')):
              with zipfile.ZipFile(apk) as z:
                  infos = z.infolist()
              total = sum(i.file_size for i in infos)
              print(f'\n== {apk}: {total / 1048576:.1f} MB isi, {len(infos)} berkas')
              for i in sorted(infos, key=lambda i: i.file_size, reverse=True)[:15]:
                  print(f'{i.file_size / 1048576:7.2f} MB  {i.filename}')
              groups = defaultdict(int)
              for i in infos:
                  key = '/'.join(i.filename.split('/')[:2]) if '/' in i.filename else i.filename
                  groups[key] += i.file_size
              print('-- per folder:')
              for key, size in sorted(groups.items(), key=lambda kv: kv[1], reverse=True)[:12]:
                  print(f'{size / 1048576:7.2f} MB  {key}')
          PY

      - name: Unggah APK arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: qrgenapp-arm64-v8a
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Unggah APK armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: qrgenapp-armeabi-v7a
          path: android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
