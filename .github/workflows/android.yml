name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang dependency
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      - name: Build APK release (tanda tangan debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Catat ukuran APK
        working-directory: android/app/build/outputs/apk/release
        run: |
          ls -lh *.apk
          {
            echo "### Ukuran APK"
            echo ""
            echo "| Berkas | Ukuran |"
            echo "|---|---|"
            for f in *.apk; do
              echo "| $f | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: qrgenapp-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
